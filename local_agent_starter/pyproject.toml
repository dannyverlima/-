[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-starter"
version = "0.1.0"
description = "Agente local multimodal com voz, monitoramento, criacao de sites e guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0",
  "pyttsx3>=2.90",
  "sounddevice>=0.4.7",
  "soundfile>=0.12.1",
]

[project.scripts]
local-agent = "app.main:main"

[tool.setuptools]
packages = ["app", "mcp"]
